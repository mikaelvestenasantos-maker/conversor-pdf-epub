# Quando um Release é publicado no GitHub (pelo site ou pelo gh), gera os
# executáveis do Windows para x64 e ARM64 e anexa ao Release, junto com a licença.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller

      - name: Gerar executável
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ConversorEPUB-${{ matrix.arch }}
          path: dist/ConversorEPUB-${{ matrix.arch }}.exe

  anexar:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Anexar executáveis ao Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LICENSE dist/LICENSE.txt
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber -R "${{ github.repository }}"
